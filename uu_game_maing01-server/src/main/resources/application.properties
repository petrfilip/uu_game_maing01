#---------------------------------------------------------------------
# Game engine
#---------------------------------------------------------------------
# Simulation period in milliseconds. 50 ms = 20 ticks/s. All in-game durations are counted in
# ticks, so changing this changes how fast the whole game runs - retune SoldatPlayer if you do.
game.engine.tickMillis=50
# Shared pool that ticks every running game; one thread handles several rooms.
game.engine.schedulerThreads=4
# Threads that write to SSE clients. Kept off the tick threads so a slow client cannot stall a game.
game.broadcast.dispatcherThreads=8
# Game used by new rooms when the client does not ask for one: soldat | bulanci
game.defaultGame=soldat

# By default read static resources from classpath(for production use). For local
# development read static files directly from /public folder in server project.
# Default value is : classpath:/public/
staticResource.location=classpath:/public/,file:./public/

