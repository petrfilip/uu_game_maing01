apply plugin: 'java'
apply plugin: "com.sourcemuse.mongo"
apply plugin: 'uu.appg01.devkit'

// repositories setup
repositories {
  maven { url uuProdRepository }
}

// java properties setup
sourceCompatibility = 1.8
targetCompatibility = 1.8

configurations {
  all*.exclude module: 'spring-boot-starter-logging'
}

dependencies {
  compile "uu.appg01:uu_appg01_server:${uuAppg01ServerVersion}"
  compile "org.modelmapper:modelmapper"

  compile 'uu.appg01:uu_appg01_telemetry:3.0.0'

  compile("uu.appg01:uu_appg01_auditlog:{uuAppg01AuditVersion}")
  runtime("uu.appg01:uu_appg01_auditlog_impl:{uuAppg01AuditVersion}")

  testCompile "uu.appg01:uu_appg01_core-test_support:${uuAppg01ServerVersion}"
}

bootRepackage {
  enabled = false
}

// testing with embedded MongoDb
mongo {
  System.setProperty("os.arch", "x86_64")
  //workaround for https://github.com/flapdoodle-oss/de.flapdoodle.embed.mongo/issues/167
  mongoVersion '3.4.3'
}

test {
  runWithMongoDb = true
}

// Simulation tests: plain JUnit, no Spring context and no database.
//
// The `test` task above boots an embedded MongoDB, and the pinned 3.4.3 build is an x86_64 binary
// that will not launch on Apple Silicon ("Bad CPU type in executable"). Without a separate task the
// rule and engine tests - which need neither Mongo nor Spring - would be unrunnable on any recent
// Mac. Run with: gradle unitTest
task unitTest(type: Test) {
  description = 'Runs game rule and engine tests without a database.'
  group = 'verification'

  useJUnit()
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath

  include 'uu/game/main/game/**'
  include 'uu/game/main/engine/**'
  include 'uu/game/main/helper/**'
  include 'uu/game/main/broadcast/**'
  include 'uu/game/main/abl/**'

  jacoco {
    enabled = false
  }

  testLogging {
    events 'passed', 'failed', 'skipped'
    exceptionFormat = 'full'
  }
}

// artifacts which will be published to Nexus repository
uuPublishArtifacts {
  sources = true
  javadoc = true
  reports = false
  tests = false
  testSources = false
}

uuPublish {
  repositories.mavenDeployer {
    repository(url: uuDevReleaseRepository)
    snapshotRepository(url: uuDevSprintRepository)
  }
}

// deployment to C3
war {
  archiveName = project.name + '.war'
  from('public') {
    into('WEB-INF/classes/public')
  }
}
